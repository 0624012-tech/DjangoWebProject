<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assessments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Assessments</h1>
        <a href="{% url 'index' %}">Back to Home</a>
        <ul>
            {% for item in assessments %}
            <li><strong>{{ item.title }}</strong> - Due: {{ item.date }} (Weight: {{ item.weight }})</li>
            {% empty %}
            <li>No assessments available.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
